name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p dist
          clang -target arm64-apple-ios15.0 -isysroot "$SDK" -dynamiclib -O2 \
            -fobjc-arc -o dist/WhaleDump.dylib WhaleDump.m -framework Foundation
          codesign -s - --force dist/WhaleDump.dylib || true
          cp WhaleDump.plist dist/
          file dist/WhaleDump.dylib
          otool -L dist/WhaleDump.dylib || true
          ls -lh dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: dist/*
